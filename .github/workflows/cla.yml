name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: ".github/cla-signatures.json"
          path-to-document: "https://github.com/irixsoft/irixmail/blob/main/CLA.md"
          branch: "cla-signatures"
          custom-notsigned-prcomment: "Thanks for the pull request. Before it can be reviewed, please read the [Contributor License Agreement](https://github.com/irixsoft/irixmail/blob/main/CLA.md) and sign it by commenting the sentence below."
          custom-pr-sign-comment: "I have read the IRIXMAIL Contributor License Agreement and I agree to it."
          custom-allsigned-prcomment: "All contributors have signed the CLA."
