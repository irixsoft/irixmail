name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  licenses:
    name: Third-party licenses
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install cargo-about
        run: |
          curl --retry 5 -fsSL https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm cargo-about

      - name: Install frontend dependencies
        run: cd frontend && bun install --frozen-lockfile

      - name: Generate THIRD-PARTY-LICENSES.md
        run: bash scripts/third-party-licenses.sh

      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/RELEASE_NOTES.md
          files: THIRD-PARTY-LICENSES.md

  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
          - target: aarch64-unknown-linux-musl
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # rust-toolchain.toml pins its own toolchain, which needs the target too
      - name: Add target to pinned toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang libclang-dev

      # zig 0.13 pinned: 0.14+ breaks the rocksdb/aws-lc-sys dep tree
      - name: Install zig and cargo-zigbuild
        run: |
          curl --retry 5 -fsSL "https://ziglang.org/download/0.13.0/zig-linux-x86_64-0.13.0.tar.xz" | sudo tar -J -x -C /usr/local
          sudo ln -s /usr/local/zig-linux-x86_64-0.13.0/zig /usr/local/bin/zig
          zig version
          curl --retry 5 -fsSL https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall --no-confirm cargo-zigbuild

      - name: Cache build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build and embed the frontend assets
        run: bash scripts/build-frontend.sh

      - name: Build static binary
        run: cargo zigbuild --release --target ${{ matrix.target }} --bin irixmail

      - name: Package release assets
        run: |
          asset="irixmail-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/irixmail" "$asset"
          sha256sum "$asset" > "$asset.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: irixmail-${{ matrix.target }}
          path: |
            irixmail-${{ matrix.target }}
            irixmail-${{ matrix.target }}.sha256
          if-no-files-found: error

      - name: Publish to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/RELEASE_NOTES.md
          files: |
            irixmail-${{ matrix.target }}
            irixmail-${{ matrix.target }}.sha256
